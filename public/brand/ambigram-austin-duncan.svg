<!--
  Rotational ambigram wordmark: AUSTIN DUNCAN.
  Turn it 180 degrees and it is the same drawing.

  Only the left half (AUSTIN) is drawn, as #awd-half. The right half is that
  same group re-used through <use> with a 180 degree rotation about the mark's
  centre, so the symmetry is exact by construction and cannot drift when a
  glyph is edited. Each left-half glyph therefore carries two readings, its
  AUSTIN letter upright and its DUNCAN letter turned:

      A/N   U/A   S/C   T/N   I/U   N/D

  Strokes are monoline to match the geometry of CMG Sans. Colour comes from
  currentColor, so set it with a text colour utility.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26.00 -26.00 1116.00 152.00" role="img" aria-label="Austin Duncan">
  <g fill="none" stroke="currentColor" stroke-width="13.0" stroke-linecap="butt" stroke-linejoin="round">
    <g id="awd-half"><g transform="translate(0.00,0)"><path d="M 9.0,100 L 30.0,0"/><path d="M 71.0,100 L 50.0,0"/><path d="M 22.4,36 L 63.0,62"/></g><g transform="translate(96.00,0)"><path d="M 3,0 L 11,80 C 11,100 15,100 22,100 L 52,100 C 59,100 63,100 63,80 L 71,0"/><path d="M 16.8,76 L 57.2,76"/></g><g transform="translate(186.00,0)"><path d="M 56,16 C 38,4 12,16 12,42 C 12,62 46,62 46,76 C 46,90 28,94 13,86"/></g><g transform="translate(270.00,0)"><path d="M 11,26 L 65,44"/><path d="M 38,35 L 38,100"/><path d="M 11,26 L 11,0"/></g><g transform="translate(362.00,0)"><path d="M 11,100 L 11,15 C 11,6 17,1 24,1 C 30,1 31,7 31,13 L 31,54"/></g><g transform="translate(420.00,0)"><path d="M 13,0 L 13,66"/><path d="M 63,0 L 63,100"/><path d="M 13,0 C 34,6 54,26 63,100"/></g></g>
    <use href="#awd-half" transform="rotate(180 532.00 50.0)"/>
  </g>
  <path d="M 532.00,40.00 L 542.00,50.00 L 532.00,60.00 L 522.00,50.00 Z" fill="currentColor"/>
</svg>